name: 检测主题依赖更新

on:
  schedule:
    - cron: "0 3 * * *" # 每天 UTC 3:00（北京时间 11:00）
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: plugins-update

env:
  TZ: Asia/Shanghai

jobs:
  update-plugins:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 main 分支
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: 检测可更新的依赖
        id: check
        run: |
          node .github/scripts/plugins-update.js check > outdated.json
          echo "count=$(jq length outdated.json)" >> "$GITHUB_OUTPUT"
          {
            echo 'json<<EOF'
            cat outdated.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 逐包创建更新 PR
        if: steps.check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTDATED_JSON: ${{ steps.check.outputs.json }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "$OUTDATED_JSON" | jq -c '.[]' | while read -r item; do
            name=$(echo "$item" | jq -r '.name')
            current=$(echo "$item" | jq -r '.current')
            target=$(echo "$item" | jq -r '.latest')
            repo=$(echo "$item" | jq -r '.repo // empty')
            slug=$(echo "$name" | sed 's/^@//; s/[^a-zA-Z0-9._-]/-/g')
            branch="chore/plugins-${slug}"

            # 去重：已存在同 head 分支的开启状态 PR 时
            # - 目标版本一致 -> 跳过
            # - PR 版本已过期 -> 关闭旧 PR，重新提交新 PR
            # - PR 版本比检测结果还新 -> 跳过（理论不会发生）
            existing_num=$(gh pr list --head "$branch" --state open --json number -q '.[0].number // empty')
            if [ -n "$existing_num" ]; then
              existing_title=$(gh pr list --head "$branch" --state open --json title -q '.[0].title')
              existing_target=${existing_title##* to }
              if [ "$existing_target" = "$target" ]; then
                echo "$name 已存在目标版本相同的 PR (#$existing_num)，跳过"
                continue
              fi
              if [ "$existing_target" = "$(printf '%s\n%s\n' "$existing_target" "$target" | sort -V | head -1)" ]; then
                echo "PR #$existing_num 的版本 $existing_target 已过期，关闭并由新 PR 取代"
                gh pr close "$existing_num" --comment "已检测到更新版本 \`${target}\`，本 PR 已过期，自动关闭并由新 PR 取代。"
              else
                echo "PR #$existing_num 的版本 $existing_target 比检测结果 $target 还新，跳过"
                continue
              fi
            fi

            git checkout -B "$branch" origin/main
            node .github/scripts/plugins-update.js apply "$name" "$target"

            if git diff --quiet themes/butterfly/plugins.yml; then
              echo "$name 无实际变更，跳过"
              git checkout main
              continue
            fi

            git add themes/butterfly/plugins.yml
            git commit -m "chore(deps): bump ${name} from ${current} to ${target}"
            git push --force origin "$branch"

            body_file=$(mktemp)
            {
              echo "自动检测到 npm 上有新版本，且已验证新版本产物文件可通过 jsDelivr 正常访问，请审查后合并。"
              echo ""
              echo "- 包: [\`${name}\`](https://www.npmjs.com/package/${name})"
              echo "- 版本: \`${current}\` → \`${target}\`"
              echo "- 修改文件: \`themes/butterfly/plugins.yml\`（条目: $(echo "$item" | jq -r '.keys | join(", ")')）"
              if [ -n "$repo" ]; then
                echo "- 更新日志: https://github.com/${repo}/releases"
              fi
            } > "$body_file"

            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(deps): bump ${name} from ${current} to ${target}" \
              --body-file "$body_file"

            git checkout main
          done
